name: Update publication list

on:
  schedule:
    - cron: "17 9 1 */2 *"    # 09:17 UTC on the 1st of every second month
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update paper counts from SciX
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python3 tools/update_pubs.py
      - name: Open an Issue for new first-author papers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f new_papers.md ]; then
            gh issue create --title "New first-author paper: add a Research Highlight?" --body-file new_papers.md
            rm new_papers.md
          fi
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Auto-update publication counts from SciX"
          git push
